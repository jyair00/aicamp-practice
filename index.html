<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점심 메뉴 투표</title>
<style>
  :root {
    --skb-red: #EA002C;
    --skb-orange: #F47725;
    --text-primary: #202124;
    --text-secondary: #5F6368;
    --bg-page: #F7F8FA;
    --bg-card: #FFFFFF;
    --border: #E5E7EB;
    --bar-base: #C4C7CC;
    --status-good: #287D4E;
    --status-bad: #B42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { border-bottom: 3px solid var(--skb-red); padding-bottom: 12px; margin-bottom: 20px; }
  header .tag { color: var(--skb-red); font-weight: 700; font-size: 14px; }
  h1 { margin: 4px 0 4px; font-size: 26px; }
  header p { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 200px;
    min-width: 0;
    padding: 10px 12px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--skb-orange); border-color: transparent; }
  button {
    font: inherit;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
  }
  button.primary { background: var(--skb-red); border-color: var(--skb-red); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(0.92); }
  button.ghost:hover { border-color: var(--text-secondary); }
  button.small { padding: 6px 10px; font-size: 13px; }
  .msg { min-height: 20px; margin-top: 8px; font-size: 13px; }
  .msg.ok { color: var(--status-good); }
  .msg.err { color: var(--status-bad); }
  .hint { color: var(--text-secondary); font-size: 13px; margin: 0 0 12px; }

  ul.menu-list { list-style: none; margin: 0; padding: 0; }
  ul.menu-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  ul.menu-list li:last-child { border-bottom: 0; }
  .menu-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .menu-count { color: var(--text-secondary); font-size: 13px; white-space: nowrap; }
  .empty { color: var(--text-secondary); font-size: 14px; padding: 12px 0; }

  .chart .bar-row { margin-bottom: 12px; }
  .bar-label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
  .bar-label .name { overflow-wrap: anywhere; }
  .bar-label .val { white-space: nowrap; color: var(--text-secondary); }
  .bar-track { background: var(--bg-page); border: 1px solid var(--border); border-radius: 6px; height: 22px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--bar-base); transition: width .3s; }
  .bar-row.lead .bar-fill { background: var(--skb-red); }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700;
    color: var(--skb-red); border: 1px solid var(--skb-red);
    border-radius: 999px; padding: 0 8px; margin-left: 6px;
  }
  .summary { font-size: 14px; color: var(--text-secondary); margin: 0 0 14px; }
  .legend { font-size: 12px; color: var(--text-secondary); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">SKB AI Camp</div>
    <h1>우리 팀 점심 메뉴 투표</h1>
    <p>데이터는 이 브라우저에만 저장돼요. 서버 전송·로그인은 없어요.</p>
  </header>

  <section class="card">
    <h2>메뉴 추가</h2>
    <form id="addForm" class="row">
      <input type="text" id="menuInput" placeholder="예: 김치찌개" maxlength="30" aria-label="메뉴 이름">
      <button type="submit" class="primary">추가</button>
    </form>
    <div id="addMsg" class="msg" role="status"></div>
  </section>

  <section class="card">
    <h2>투표하기</h2>
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="voterInput" placeholder="내 이름 (1인 1표)" maxlength="20" aria-label="투표자 이름">
    </div>
    <p class="hint">이름을 적고 메뉴의 [투표]를 눌러 주세요. 같은 이름으로 다시 누르면 표가 그 메뉴로 옮겨져요.</p>
    <ul id="menuList" class="menu-list"></ul>
    <div id="voteMsg" class="msg" role="status"></div>
  </section>

  <section class="card">
    <h2>투표 결과</h2>
    <p id="summary" class="summary"></p>
    <div id="chart" class="chart"></div>
    <div class="legend">
      <span><i style="background:var(--skb-red)"></i>1위 메뉴</span>
      <span><i style="background:var(--bar-base)"></i>그 외 메뉴</span>
      <span>단위: 표</span>
    </div>
  </section>

  <div class="footer-actions">
    <button type="button" class="ghost" id="resetVotes">투표만 초기화</button>
    <button type="button" class="ghost" id="resetAll">전체 초기화</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'skb-lunch-vote-v1';
  // state: { menus: [{id, name}], votes: { voterName: menuId } }
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.menus) && s.votes && typeof s.votes === 'object') return s;
      }
    } catch (e) {}
    return { menus: [], votes: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function norm(s) { return s.trim().replace(/\s+/g, ' '); }

  function counts() {
    var c = {};
    state.menus.forEach(function (m) { c[m.id] = 0; });
    Object.keys(state.votes).forEach(function (v) {
      var id = state.votes[v];
      if (id in c) c[id]++;
    });
    return c;
  }
  function votersOf(id) {
    return Object.keys(state.votes).filter(function (v) { return state.votes[v] === id; });
  }

  function setMsg(el, text, kind) {
    el.textContent = text;
    el.className = 'msg ' + (kind || '');
  }

  var $ = function (id) { return document.getElementById(id); };
  var menuInput = $('menuInput'), voterInput = $('voterInput');

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = norm(menuInput.value);
    if (!name) { setMsg($('addMsg'), '메뉴 이름을 입력해 주세요.', 'err'); return; }
    var dup = state.menus.some(function (m) { return m.name.toLowerCase() === name.toLowerCase(); });
    if (dup) { setMsg($('addMsg'), '‘' + name + '’은(는) 이미 있는 메뉴예요.', 'err'); return; }
    state.menus.push({ id: uid(), name: name });
    save();
    menuInput.value = '';
    setMsg($('addMsg'), '‘' + name + '’ 메뉴를 추가했어요.', 'ok');
    render();
    menuInput.focus();
  });

  function vote(id) {
    var voter = norm(voterInput.value);
    var msg = $('voteMsg');
    if (!voter) { setMsg(msg, '먼저 내 이름을 입력해 주세요.', 'err'); voterInput.focus(); return; }
    var menu = state.menus.find(function (m) { return m.id === id; });
    var prev = state.votes[voter];
    if (prev === id) { setMsg(msg, voter + '님은 이미 ‘' + menu.name + '’에 투표했어요.', 'err'); return; }
    state.votes[voter] = id;
    save();
    var prevMenu = state.menus.find(function (m) { return m.id === prev; });
    setMsg(msg, prevMenu
      ? voter + '님의 표를 ‘' + prevMenu.name + '’에서 ‘' + menu.name + '’(으)로 옮겼어요.'
      : voter + '님이 ‘' + menu.name + '’에 투표했어요.', 'ok');
    render();
  }

  function removeMenu(id) {
    var menu = state.menus.find(function (m) { return m.id === id; });
    var n = votersOf(id).length;
    if (!confirm('‘' + menu.name + '’ 메뉴를 삭제할까요?' + (n ? ' 받은 ' + n + '표도 함께 사라져요.' : ''))) return;
    state.menus = state.menus.filter(function (m) { return m.id !== id; });
    Object.keys(state.votes).forEach(function (v) { if (state.votes[v] === id) delete state.votes[v]; });
    save();
    render();
  }

  $('resetVotes').addEventListener('click', function () {
    if (!confirm('모든 표를 지울까요? 메뉴는 남아요.')) return;
    state.votes = {}; save(); setMsg($('voteMsg'), '투표를 초기화했어요.', 'ok'); render();
  });
  $('resetAll').addEventListener('click', function () {
    if (!confirm('메뉴와 표를 모두 지울까요?')) return;
    state = { menus: [], votes: {} }; save(); setMsg($('voteMsg'), '전체를 초기화했어요.', 'ok'); render();
  });

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    var c = counts();
    var list = $('menuList');
    list.innerHTML = '';
    if (!state.menus.length) {
      list.appendChild(el('li', 'empty', '아직 메뉴가 없어요. 위에서 메뉴를 추가해 주세요.'));
    }
    state.menus.forEach(function (m) {
      var li = el('li');
      li.appendChild(el('span', 'menu-name', m.name));
      li.appendChild(el('span', 'menu-count', c[m.id] + '표'));
      var vb = el('button', 'primary small', '투표');
      vb.type = 'button';
      vb.setAttribute('aria-label', m.name + '에 투표');
      vb.onclick = function () { vote(m.id); };
      var db = el('button', 'ghost small', '삭제');
      db.type = 'button';
      db.setAttribute('aria-label', m.name + ' 삭제');
      db.onclick = function () { removeMenu(m.id); };
      li.appendChild(vb); li.appendChild(db);
      list.appendChild(li);
    });

    // 결과 그래프
    var total = Object.keys(c).reduce(function (s, k) { return s + c[k]; }, 0);
    var max = 0;
    Object.keys(c).forEach(function (k) { if (c[k] > max) max = c[k]; });
    var sorted = state.menus.slice().sort(function (a, b) { return c[b.id] - c[a.id]; });
    var chart = $('chart');
    chart.innerHTML = '';

    if (!state.menus.length) {
      $('summary').textContent = '메뉴를 추가하면 결과가 여기에 표시돼요.';
      return;
    }
    var leaders = sorted.filter(function (m) { return max > 0 && c[m.id] === max; });
    $('summary').textContent = '메뉴 ' + state.menus.length + '개 · 총 ' + total + '표' +
      (leaders.length ? ' · 현재 1위: ' + leaders.map(function (m) { return m.name; }).join(', ') +
        (leaders.length > 1 ? ' (공동)' : '') : ' · 아직 투표가 없어요');

    sorted.forEach(function (m) {
      var n = c[m.id];
      var pct = total ? Math.round(n / total * 100) : 0;
      var row = el('div', 'bar-row' + (max > 0 && n === max ? ' lead' : ''));
      var label = el('div', 'bar-label');
      var name = el('span', 'name', m.name);
      if (max > 0 && n === max) name.appendChild(el('span', 'badge', '1위'));
      label.appendChild(name);
      label.appendChild(el('span', 'val', n + '표 (' + pct + '%)'));
      var track = el('div', 'bar-track');
      track.setAttribute('role', 'img');
      track.setAttribute('aria-label', m.name + ' ' + n + '표, ' + pct + '%');
      var fill = el('div', 'bar-fill');
      fill.style.width = (max ? n / max * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(label); row.appendChild(track);
      var who = votersOf(m.id);
      if (who.length) {
        var w = el('div', 'hint', '투표: ' + who.join(', '));
        w.style.margin = '4px 0 0';
        row.appendChild(w);
      }
      chart.appendChild(row);
    });
  }

  render();
})();
</script>
</body>
</html>
